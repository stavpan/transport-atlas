name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system tools (pandoc for the site, graphviz for the concept map)
        run: sudo apt-get update && sudo apt-get install -y pandoc graphviz
      - name: python deps for the figures
        run: pip install --quiet matplotlib numpy
      - name: figures
        run: |
          python scripts/make_figures.py
          python scripts/make_concept_map.py
      - name: build the site
        run: python build.py --levels --standalone
      - name: upload artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # the site is ~46 MB (four builds: full + L1/L2/L3, plus figures and the single-file
          # edition). The first deployment can sit in `updating_pages` for a while, and the
          # action's default timeout is 10 minutes — which we exceeded once. Give it 30.
          timeout: 1800000
